<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevSignal Radar</title><style>body{max-width:900px;margin:40px auto;background:#10151f;color:#e7edf7;font:16px system-ui;padding:0 16px}.card{background:#1b2432;margin:12px 0;padding:18px;border-radius:12px}.score{color:#55d69b;font-size:24px}a{color:#8cc8ff}</style><h1>DevSignal Radar</h1><p id="date">加载中…</p><main id="cards"></main><script>fetch('public/data/latest.json').then(r=>r.json()).then(d=>{date.textContent='最新更新：'+d.date;cards.innerHTML=d.items.map(x=>`<article class=card><div class=score>${x.score.toFixed(1)}</div><h2>${x.title}</h2><p>${x.source}</p><a href="${x.url}">阅读原文</a></article>`).join('')})</script>
